services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: news-portal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - uploads-data:/app/backend/uploads
    networks:
      - news-portal-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: news-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - news-portal-network

volumes:
  uploads-data:

networks:
  news-portal-network:
    driver: bridge
